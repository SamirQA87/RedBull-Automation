name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QA_EMAIL: ${{ secrets.QA_EMAIL }}
  QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
  OFFLINE_DEVICE_ID: ${{ secrets.OFFLINE_DEVICE_ID }}

jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:stable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-stable
          path: playwright-report/
          retention-days: 14

  known-bugs:
    runs-on: ubuntu-latest
    continue-on-error: true # these fail by design until bugs #12 and #16 are fixed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:known-bugs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-known-bugs
          path: playwright-report/
          retention-days: 14
